name: macOS DMG

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  dmg:
    name: Build ${{ matrix.arch }} disk image
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            arch: arm64
          - runner: macos-13
            arch: x86_64

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run tests
        run: mvn -B test

      - name: Build AdaGIDE.dmg
        run: ./scripts/build-dmg.sh

      - name: Verify the bundle
        run: |
          set -euo pipefail
          DMG="$(ls dist/*.dmg | head -1)"
          echo "Built $DMG"
          hdiutil attach "$DMG" -nobrowse -mountpoint /tmp/adagide-dmg
          ls -la /tmp/adagide-dmg
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' /tmp/adagide-dmg/AdaGIDE.app/Contents/Info.plist
          # jpackage signs ad-hoc on Apple Silicon; on Intel the bundle may be unsigned.
          codesign --verify --deep --verbose=2 /tmp/adagide-dmg/AdaGIDE.app || echo "bundle is not signed"
          hdiutil detach /tmp/adagide-dmg

      - name: Upload the disk image
        uses: actions/upload-artifact@v4
        with:
          name: AdaGIDE-${{ matrix.arch }}-dmg
          path: dist/*.dmg
          if-no-files-found: error

      - name: Attach the disk image to the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1 \
            || gh release create "${GITHUB_REF_NAME}" --generate-notes
          gh release upload "${GITHUB_REF_NAME}" dist/*.dmg --clobber
